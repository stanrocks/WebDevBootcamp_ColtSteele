<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathon Form</title>
</head>

<body>
    <h1>Race Registration!</h1>
    <form action="">
        <div>
            <label for="firstname">First Name</label>
            <input type="text" name="firstname" id="firstname" required>
            <label for="lastname">Last Name</label>
            <input type="text" name="lastname" id="lastname" required>
        </div>
        <p>Select a Race:</p>
        <div>
            <input type="radio" name="racetype" id="funrun5k" value="funrun5k" required>
            <label for="funrun5k">Fun Run 5k</label>
        </div>
        <div>
            <input type="radio" name="racetype" id="halfmarathon" value="halfmarathon">
            <label for="halfmarathon">Half Marathon</label>
        </div>
        <div>
            <input type="radio" name="racetype" id="fullmarathon" value="fullmarathon">
            <label for="fullmarathon">Full Marathon</label>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>
        <div>
            Select Age Group:
            <select name="age" id="age">
                <option value="under18">under 18</option>
                <option value="18-30">18-30</option>
                <option value="30-50">30-50</option>
                <option value="50plus">50+</option>
            </select>
        </div>
        <div>
            <button>Register!</button>
        </div>
    </form>
</body>

</html>
